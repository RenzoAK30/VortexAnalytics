<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Analytics - Dashboard Logístico</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0b0f17',
                        cardbg: '#131b2e',
                        borderglow: '#1e293b',
                        neonCian: '#00f2fe',
                        neonPurple: '#9d4edd',
                        neonEmerald: '#10b981',
                        neonAmber: '#f59e0b',
                        neonRose: '#f43f5e'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <!-- SheetJS (xlsx) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Chart.js and DataLabels -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f17; color: #f1f5f9; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0b0f17; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        .glow-cian { box-shadow: 0 0 20px -5px rgba(0, 242, 254, 0.25); }
        .glow-purple { box-shadow: 0 0 20px -5px rgba(157, 78, 221, 0.25); }
        .glow-emerald { box-shadow: 0 0 20px -5px rgba(16, 185, 129, 0.25); }
        .glow-amber { box-shadow: 0 0 20px -5px rgba(245, 158, 11, 0.25); }
        .glow-rose { box-shadow: 0 0 20px -5px rgba(244, 63, 94, 0.25); }
        .glass-card {
            background: linear-gradient(135deg, rgba(19, 27, 46, 0.9) 0%, rgba(15, 23, 42, 0.95) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
        }
        .bg-grad-primary { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #9333ea 100%); }
        .bg-grad-emerald { background: linear-gradient(135deg, #059669 0%, #10b981 100%); }
        .menu-item-active {
            background: rgba(0, 242, 254, 0.1);
            color: #00f2fe;
            border-left: 4px solid #00f2fe;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <!-- Top Header -->
    <header class="bg-[#0f172a]/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50 shadow-2xl">
        <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white text-xl p-2 rounded-xl bg-slate-800 border border-slate-700 transition">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="w-12 h-12 rounded-2xl bg-grad-primary flex items-center justify-center text-white text-2xl shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-truck-fast"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-indigo-400 to-purple-400">
                        VORTEX <span class="text-xs px-2 py-0.5 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 font-bold tracking-wider uppercase ml-1">ANALYTICS</span>
                    </h1>
                    <p class="text-xs text-slate-400">Dashboard de Control Logístico & Análisis de Choferes</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <button onclick="loadMockData()" class="px-4 py-2.5 rounded-xl font-semibold text-xs bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-cyan-500/35 transition-all flex items-center space-x-2 shadow-lg">
                    <i class="fa-solid fa-bolt"></i><span>Cargar Datos Demo</span>
                </button>
                <label for="excelFile" class="cursor-pointer px-4 py-2.5 rounded-xl font-bold text-xs bg-grad-emerald hover:brightness-110 text-white transition-all shadow-lg flex items-center space-x-2">
                    <i class="fa-solid fa-file-excel text-lg"></i><span>Subir Excel Manual</span>
                </label>
                <input type="file" id="excelFile" accept=".xlsx, .xls" class="hidden" onchange="handleFileUpload(event)">
            </div>
        </div>
    </header>

    <!-- Main Container with Sidebar + Content -->
    <div class="flex-1 flex max-w-[1600px] w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 gap-6">

        <!-- MENÚ LATERAL IZQUIERDO -->
        <aside id="sidebar" class="w-64 flex-shrink-0 space-y-6">
            <div class="glass-card rounded-2xl p-4 space-y-6 sticky top-28 shadow-2xl border border-slate-800">
                <div class="pb-2 border-b border-slate-800">
                    <span class="text-xs font-black uppercase text-cyan-400 tracking-wider flex items-center">
                        <i class="fa-solid fa-compass mr-2"></i>Navegación Principal
                    </span>
                </div>

                <!-- Botón Resumen Principal -->
                <div>
                    <button onclick="switchTab('general')" id="navGeneralBtn" class="w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-between text-slate-300 hover:bg-slate-800/60 menu-item-active">
                        <span class="flex items-center"><i class="fa-solid fa-chart-pie mr-2.5 text-cyan-400"></i>Resumen General</span>
                    </button>
                </div>

                <!-- SECCIÓN REPORTES -->
                <div class="space-y-1.5">
                    <button onclick="toggleGroup('groupReportes')" class="w-full flex items-center justify-between text-xs font-bold uppercase text-slate-400 px-2 py-1.5 hover:text-slate-200">
                        <span class="flex items-center"><i class="fa-solid fa-folder-open text-amber-400 mr-2"></i>Reportes</span>
                        <i id="iconGroupReportes" class="fa-solid fa-chevron-down text-[10px] transition-transform"></i>
                    </button>
                    <div id="groupReportes" class="pl-3 space-y-1 border-l-2 border-slate-800 ml-2">
                        <button onclick="switchTab('drivers')" id="navDriversBtn" class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition flex items-center">
                            <i class="fa-solid fa-users-viewfinder mr-2 text-amber-400"></i>Chofer por cliente
                        </button>
                        <button onclick="switchTab('monthly')" id="navMonthlyBtn" class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition flex items-center">
                            <i class="fa-solid fa-calendar-days mr-2 text-emerald-400"></i>Mes a Mes
                        </button>
                        <button onclick="switchTab('partial')" id="navPartialBtn" class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition flex items-center">
                            <i class="fa-solid fa-sliders mr-2 text-cyan-400"></i>Comparativa de Rango
                        </button>
                    </div>
                </div>

                <!-- SECCIÓN HISTORIAL -->
                <div class="space-y-1.5">
                    <button onclick="toggleGroup('groupHistorial')" class="w-full flex items-center justify-between text-xs font-bold uppercase text-slate-400 px-2 py-1.5 hover:text-slate-200">
                        <span class="flex items-center"><i class="fa-solid fa-clock-rotate-left text-purple-400 mr-2"></i>Historial</span>
                        <i id="iconGroupHistorial" class="fa-solid fa-chevron-down text-[10px] transition-transform"></i>
                    </button>
                    <div id="groupHistorial" class="pl-3 space-y-1 border-l-2 border-slate-800 ml-2">
                        <button onclick="switchTab('history')" id="navHistoryBtn" class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition flex items-center">
                            <i class="fa-solid fa-id-badge mr-2 text-purple-400"></i>Viajes por Conductor
                        </button>
                    </div>
                </div>

                <!-- SECCIÓN OPERACIONES -->
                <div class="space-y-1.5">
                    <button onclick="toggleGroup('groupCaasa')" class="w-full flex items-center justify-between text-xs font-bold uppercase text-slate-400 px-2 py-1.5 hover:text-slate-200">
                        <span class="flex items-center"><i class="fa-solid fa-industry text-indigo-400 mr-2"></i>Operaciones</span>
                        <i id="iconGroupCaasa" class="fa-solid fa-chevron-down text-[10px] transition-transform"></i>
                    </button>
                    <div id="groupCaasa" class="pl-3 space-y-1 border-l-2 border-slate-800 ml-2">
                        <button onclick="switchTab('caasa')" id="navCaasaBtn" class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition flex items-center">
                            <i class="fa-solid fa-chart-column mr-2 text-indigo-400"></i>Análisis CAASA
                        </button>
                    </div>
                </div>
            </div>
        </aside>

        <!-- ÁREA DE CONTENIDO PRINCIPAL -->
        <main class="flex-1 space-y-6 overflow-hidden">

            <!-- Upload / Loading Zone -->
            <div id="uploadZone" class="glass-card rounded-3xl p-10 text-center relative overflow-hidden transition-all duration-300 border-2 border-dashed border-indigo-500/30 hover:border-cyan-400/60 my-6 shadow-2xl">
                <div class="max-w-2xl mx-auto space-y-6 relative z-10">
                    <div class="w-20 h-20 bg-gradient-to-tr from-indigo-500/20 to-cyan-500/20 text-cyan-400 rounded-3xl flex items-center justify-center mx-auto text-3xl border border-cyan-500/30 glow-cian animate-pulse">
                        <i class="fa-solid fa-spinner fa-spin"></i>
                    </div>
                    <div>
                        <h2 class="text-3xl font-black text-white tracking-tight">Cargando 'VIAJES  2026.xlsx'...</h2>
                        <p class="text-slate-400 text-sm mt-2">
                            Descargando y analizando los datos más recientes alojados en GitHub. Por favor espera unos segundos.
                        </p>
                    </div>
                    <div class="pt-2 flex flex-col sm:flex-row justify-center items-center gap-4">
                        <label for="excelFile" class="cursor-pointer w-full sm:w-auto px-8 py-3.5 rounded-2xl bg-grad-primary hover:brightness-110 text-white font-bold text-sm transition-all shadow-xl flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-folder-open"></i><span>Subir Otro Excel Manual</span>
                        </label>
                        <button onclick="loadMockData()" class="w-full sm:w-auto px-8 py-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold text-sm transition-all flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i><span>Probar Demo interactiva</span>
                        </button>
                    </div>
                </div>
            </div>

            <div id="dashboardApp" class="hidden space-y-6">
                <!-- Filtros Globales -->
                <section class="glass-card rounded-2xl p-5 shadow-2xl border border-slate-800 relative">
                    <div class="flex items-center justify-between mb-3 border-b border-slate-800/80 pb-2.5">
                        <div class="flex items-center space-x-2">
                            <i class="fa-solid fa-sliders text-cyan-400 text-base"></i>
                            <h3 class="text-xs font-bold text-slate-200 uppercase tracking-wider">Filtros Interactivos Globales</h3>
                        </div>
                        <button onclick="resetFilters()" class="text-xs text-slate-400 hover:text-cyan-400 transition-colors flex items-center space-x-1 font-semibold">
                            <i class="fa-solid fa-rotate-right"></i><span>Restablecer Filtros</span>
                        </button>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-400 uppercase mb-1">Mes / Periodo</label>
                            <select id="filterMonth" onchange="applyFilters()" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-cyan
