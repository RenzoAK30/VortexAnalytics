<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex - Dashboard</title>
    <link rel="icon" type="image/x-icon" href="vortex.ico">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0b0f17',
                        cardbg: '#131b2e',
                        borderglow: '#1e293b',
                        neonCian: '#00f2fe',
                        neonPurple: '#9d4edd',
                        neonEmerald: '#10b981',
                        neonAmber: '#f59e0b',
                        neonRose: '#f43f5e'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <!-- SheetJS (xlsx) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Chart.js and DataLabels -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f17; color: #f1f5f9; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0b0f17; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        .glow-cian { box-shadow: 0 0 20px -5px rgba(0, 242, 254, 0.25); }
        .glow-purple { box-shadow: 0 0 20px -5px rgba(157, 78, 221, 0.25); }
        .glow-emerald { box-shadow: 0 0 20px -5px rgba(16, 185, 129, 0.25); }
        .glow-amber { box-shadow: 0 0 20px -5px rgba(245, 158, 11, 0.25); }
        .glow-rose { box-shadow: 0 0 20px -5px rgba(244, 63, 94, 0.25); }
        .glass-card {
            background: linear-gradient(135deg, rgba(19, 27, 46, 0.9) 0%, rgba(15, 23, 42, 0.95) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
        }
        .bg-grad-primary { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #9333ea 100%); }
        .bg-grad-emerald { background: linear-gradient(135deg, #059669 0%, #10b981 100%); }
        .menu-item-active {
            background: rgba(0, 242, 254, 0.1);
            color: #00f2fe;
            border-left: 4px solid #00f2fe;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <!-- Top Header -->
    <header class="bg-[#0f172a]/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50 shadow-2xl">
        <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white text-xl p-2.5 rounded-xl bg-slate-800 border border-slate-700 hover:border-cyan-400 transition-all flex items-center justify-center">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <img src="logo.png" alt="Logo Vortex" class="w-44 h-14 rounded-2xl object-cover shadow-lg shadow-indigo-500/30">
                
            </div>

            <div class="flex items-center space-x-2 sm:space-x-3">
                
                <input type="file" id="excelFile" accept=".xlsx, .xls" class="hidden" onchange="handleFileUpload(event)">
            </div>
        </div>
    </header>

    <!-- Main Container with Sidebar + Content -->
    <div class="flex-1 flex max-w-[1600px] w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 gap-6 relative">

        <!-- MENÚ LATERAL IZQUIERDO (OCULTO POR DEFECTO PARA GANAR ESPACIO) -->
        <aside id="sidebar" class="w-64 flex-shrink-0 space-y-6 hidden fixed lg:sticky top-24 left-4 z-40">
            <div class="glass-card rounded-2xl p-4 space-y-6 shadow-2xl border border-slate-800">
                <div class="pb-2 border-b border-slate-800 flex justify-between items-center">
                    <span class="text-xs font-black uppercase text-cyan-400 tracking-wider flex items-center">
                        <i class="fa-solid fa-compass mr-2"></i>Navegación Principal
                    </span>
                    <button onclick="toggleSidebar()" class="text-slate-500 hover:text-white text-xs p-1">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <div>
                    <button onclick="switchTab('general')" id="navGeneralBtn" class="w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-between text-slate-300 hover:bg-slate-800/60 menu-item-active">
                        <span class="flex items-center"><i class="fa-solid fa-chart-pie mr-2.5 text-cyan-400"></i>Resumen General</span>
                    </button>
                </div>

                <div class="space-y-1.5">
                    <button onclick="toggleGroup('groupReportes')" class="w-full flex items-center justify-between text-xs font-bold uppercase text-slate-400 px-2 py-1.5 hover:text-slate-200">
                        <span class="flex items-center"><i class="fa-solid fa-folder-open text-amber-400 mr-2"></i>Reportes</span>
                        <i id="iconGroupReportes" class="fa-solid fa-chevron-down text-[10px] transition-transform"></i>
                    </button>
                    <div id="groupReportes" class="pl-3 space-y-1 border-l-2 border-slate-800 ml-2">
                        <button onclick="switchTab('drivers')" id="navDriversBtn" class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition flex items-center">
                            <i class="fa-solid fa-users-viewfinder mr-2 text-amber-400"></i>Chofer por cliente
                        </button>
                        <button onclick="switchTab('monthly')" id="navMonthlyBtn" class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition flex items-center">
                            <i class="fa-solid fa-calendar-days mr-2 text-emerald-400"></i>Mes a Mes
                        </button>
                        <button onclick="switchTab('partial')" id="navPartialBtn" class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition flex items-center">
                            <i class="fa-solid fa-sliders mr-2 text-cyan-400"></i>Comparativa de Rango
                        </button>
                    </div>
                </div>

                <div class="space-y-1.5">
                    <button onclick="toggleGroup('groupHistorial')" class="w-full flex items-center justify-between text-xs font-bold uppercase text-slate-400 px-2 py-1.5 hover:text-slate-200">
                        <span class="flex items-center"><i class="fa-solid fa-clock-rotate-left text-purple-400 mr-2"></i>Historial</span>
                        <i id="iconGroupHistorial" class="fa-solid fa-chevron-down text-[10px] transition-transform"></i>
                    </button>
                    <div id="groupHistorial" class="pl-3 space-y-1 border-l-2 border-slate-800 ml-2">
                        <button onclick="switchTab('history')" id="navHistoryBtn" class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition flex items-center">
                            <i class="fa-solid fa-id-badge mr-2 text-purple-400"></i>Viajes por Conductor
                        </button>
                    </div>
                </div>

                <div class="space-y-1.5">
                    <button onclick="toggleGroup('groupCaasa')" class="w-full flex items-center justify-between text-xs font-bold uppercase text-slate-400 px-2 py-1.5 hover:text-slate-200">
                        <span class="flex items-center"><i class="fa-solid fa-industry text-indigo-400 mr-2"></i>Operaciones</span>
                        <i id="iconGroupCaasa" class="fa-solid fa-chevron-down text-[10px] transition-transform"></i>
                    </button>
                    <div id="groupCaasa" class="pl-3 space-y-1 border-l-2 border-slate-800 ml-2">
                        <button onclick="switchTab('caasa')" id="navCaasaBtn" class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition flex items-center">
                            <i class="fa-solid fa-chart-column mr-2 text-indigo-400"></i>Análisis CAASA
                        </button>
                    </div>
                </div>
            </div>
        </aside>

        <!-- ÁREA DE CONTENIDO PRINCIPAL -->
        <main class="flex-1 space-y-6 overflow-hidden">

            <!-- Upload / Loading Zone -->
            <div id="uploadZone" class="glass-card rounded-3xl p-6 sm:p-10 text-center relative overflow-hidden transition-all duration-300 border-2 border-dashed border-indigo-500/30 hover:border-cyan-400/60 my-4 sm:my-6 shadow-2xl">
                <div class="max-w-2xl mx-auto space-y-4 sm:space-y-6 relative z-10">
                    <div class="w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-tr from-indigo-500/20 to-cyan-500/20 text-cyan-400 rounded-3xl flex items-center justify-center mx-auto text-2xl sm:text-3xl border border-cyan-500/30 glow-cian animate-pulse">
                        <i class="fa-solid fa-spinner fa-spin"></i>
                    </div>
                    <div>
                        <h2 class="text-xl sm:text-3xl font-black text-white tracking-tight">Cargando 'VIAJES 2026.xlsx'...</h2>
                        <p class="text-slate-400 text-xs sm:text-sm mt-2">
                            Descargando y procesando los datos. Por favor espera un momento.
                        </p>
                    </div>
                    <div class="pt-2 flex flex-col sm:flex-row justify-center items-center gap-3">

                    </div>
                </div>
            </div>

            <div id="dashboardApp" class="hidden space-y-6">
                <!-- Filtros Globales -->
                <section class="glass-card rounded-2xl p-4 sm:p-5 shadow-2xl border border-slate-800 relative">
                    <div class="flex items-center justify-between mb-3 border-b border-slate-800/80 pb-2.5">
                        <div class="flex items-center space-x-2">
                            <i class="fa-solid fa-sliders text-cyan-400 text-base"></i>
                            <h3 class="text-xs font-bold text-slate-200 uppercase tracking-wider">Filtros Globales</h3>
                        </div>
                        <button onclick="resetFilters()" class="text-xs text-slate-400 hover:text-cyan-400 transition-colors flex items-center space-x-1 font-semibold">
                            <i class="fa-solid fa-rotate-right"></i><span>Restable
